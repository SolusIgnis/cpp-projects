name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
on:
  # Triggers on all pushes but skips tooling checks except on pushes to main (to run post-PR)
  push:
    paths-ignore:
      - "Dockerfile"
  #  branches: [ main ]
  # Triggers on ALL PRs regardless of location
  pull_request:
  # Allows manual workflow runs via the GitHub UI
  workflow_dispatch:
    inputs:
      notooling:
        description: "Skip clang-format and clang-tidy?"
        required: false
        type: boolean
        default: false

jobs:
  ci-build_and_test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/solusignis/ci-env-llvm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake --preset=clang-debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/usr/lib/llvm-23/lib/libc++.modules.json

      - name: Build
        run: cmake --build --preset=clang-debug

      - name: Run tests
        run: cmake --build --preset=clang-debug --target=tests.run

  ci-tooling-clang_llvm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/solusignis/ci-env-llvm:latest
    if: >-
      ${{ github.event.inputs.notooling != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake --preset=clang-debug \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/usr/lib/llvm-23/lib/libc++.modules.json

      - name: clang-format check
        run: cmake --build --preset=clang-debug --target=format-check

      - name: Build
        run: cmake --build --preset=clang-debug
        
      - name: Check Compilation Database
        run: |
          python3 - <<'PY'
          import json
          import re

          with open("build/clang/clang-debug/compile_commands.json") as f:
              commands = json.load(f)

          test_tus = [
              entry["file"]
              for entry in commands
              if re.search(r"(^|/)tests/", entry["file"])
          ]

          print(f"Test TUs in compilation database: {len(test_tus)}")
          for path in test_tus:
              print(f"  {path}")
          PY

      - name: clang-tidy checks
        run: cmake --build --preset=clang-debug --target=tidy-check-fast
