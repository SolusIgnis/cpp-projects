name: Fix Formatting

on:
  workflow_dispatch:

jobs:
  fix-formatting:
    runs-on: ubuntu-latest
    container:
      options: --user 1001:1001
      image: ghcr.io/solusignis/ci-env-llvm:latest
      
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake --preset=clang-debug \
            -DCMAKE_CXX_FLAGS="-nostdinc++ -isystem $GITHUB_WORKSPACE/libcxx-21/include/c++/v1 -nostdlib++ -Wall -Wextra -fcolor-diagnostics" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/libcxx-21/lib -lc++ -lc++abi -Wl,-rpath,$GITHUB_WORKSPACE/libcxx-21/lib"

      - name: Run clang-format
        id: format-run
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          cmake --build --preset=clang-debug --target=format-fix
          git add modules
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Using the official GitHub Actions Bot identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: Ran clang-format."
          git push origin "${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed format fixes."
          
      - name: Trigger CI workflow
        if: steps.format-run.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "ci-formatting-fixed",
              "client_payload": {
                "branch": "${GITHUB_REF_NAME}"
              }
            }'
