name: Publish CI Image

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      [feature/docker_ci]
    paths:
      - "Dockerfile"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/solusignis/ci-env-llvm

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable buildx (required for caching + modern builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags + labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      # Build and push
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for GHCR latest convergence
        shell: bash
        run: |
          IMAGE="ghcr.io/solusignis/ci-env-llvm:latest"
          EXPECTED="${{ steps.build.outputs.digest }}"

          EXPECTED="${EXPECTED//\"/}"

          echo "Waiting for latest → $EXPECTED"

          sleep 1

          for i in {1..60}; do
            RESOLVED=$(docker buildx imagetools inspect "$IMAGE" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null || true)

            RESOLVED="${RESOLVED//\"/}"

            if [ "$EXPECTED" = "$RESOLVED" ]; then
              echo "GHCR is consistent"
              exit 0
            fi

            echo "waiting... ($i)"
            sleep 2
          done

          echo "GHCR did not converge to expected digest"
          exit 1
          
      - name: Trigger CI Workflow
        env:
          GH_TOKEN: ${{ secrets.BOT_PUSH_CI_TRIGGER_TOKEN }}
        run: gh workflow run ci.yml --ref ${{ github.ref_name }} -f notooling=false
