name: VERSION Fixer

concurrency:
  group: version-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
  
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  version-fix:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]' && contains(github.head_ref, 'release/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}  # ensures local branch exists
          fetch-depth: 0

      - name: Extract module path and release version
        id: parse_branch
        run: |
          BRANCH="${{ github.head_ref }}" # PR source branch
          TARGET="${{ github.base_ref }}" # PR target branch

          if [ -z "$BRANCH" ]; then
            echo "Not a PR. Skipping."
            echo "release_branch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if [[ "$TARGET" != "main" ]]; then
            echo "PR branch not merging to main. Skipping."
            echo "release_branch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Source branch: $BRANCH"

          # Match branches with an optional prefix path, release/, and a valid semantic version (X.Y.Z[-pre.release][+build]).
          REGEX='^(.*\/)?release\/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if grep -Eq "$REGEX" <<< "$BRANCH"; then
            echo "PR branch matches release branch pattern."
            RELEASE_BRANCH=true
            # Following branch name parsing assumes branch validation by regex above.

            # Optional prefix before release/, strip trailing slash if any
            MODULE_PATH="${BRANCH%release/*}"
            MODULE_PATH="${MODULE_PATH%/}"
            
            # Version comes from everything after release/
            VERSION_TAG="${BRANCH##*release/}"
            
            # Split build metadata (+...)
            if [[ "$VERSION_TAG" == *"+"* ]]; then
              VERSION_CORE="${VERSION_TAG%%+*}"
              VERSION_BUILD="${VERSION_TAG#*+}"
              VERSION_BUILD_TAG="+$VERSION_BUILD"
            else
              VERSION_CORE="$VERSION_TAG"
              VERSION_BUILD=""
              VERSION_BUILD_TAG=""
            fi

            # Split prerelease (-...)
            if [[ "$VERSION_CORE" == *"-"* ]]; then
              VERSION_NUMBER="${VERSION_CORE%%-*}"
              VERSION_PRERELEASE="${VERSION_CORE#*-}"
              VERSION_PRERELEASE_TAG="-$VERSION_PRERELEASE"
            else
              VERSION_NUMBER="$VERSION_CORE"
              VERSION_PRERELEASE=""
              VERSION_PRERELEASE_TAG=""
            fi

            RELEASE_VERSION="$VERSION_NUMBER$VERSION_PRERELEASE_TAG"

            echo "module_path=$MODULE_PATH" >> "$GITHUB_OUTPUT"
            echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "PR branch does NOT match release branch pattern. Skipping."
            RELEASE_BRANCH=false
          fi

          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check and fix VERSION file
        id: update_version
        if: steps.parse_branch.outputs.release_branch == 'true'
        run: |
          MODULE_PATH="${{ steps.parse_branch.outputs.module_path }}"
          RELEASE_VERSION="${{ steps.parse_branch.outputs.release_version }}"
          VERSION_FILE="${MODULE_PATH:+$MODULE_PATH/}VERSION"

          echo "changed=false" >> "$GITHUB_OUTPUT"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "VERSION file missing — nothing to fix."
            exit 0
          fi

          CURRENT_VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")

          if [[ "$RELEASE_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "VERSION file already matches branch ($RELEASE_VERSION) — nothing to do."
            exit 0
          fi

          echo "$RELEASE_VERSION" > "$VERSION_FILE"
          git add "$VERSION_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Using the official GitHub Actions Bot identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: Update ${MODULE_PATH:+$MODULE_PATH/}VERSION file to $RELEASE_VERSION for release"
          # In case someone immediately pushed a quick fix after opening the PR:
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "${GITHUB_HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed VERSION update."

      - name: Trigger CI workflow
        if: steps.update_version.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "ci-version-updated",
              "client_payload": {
                "branch": "'"${BRANCH_NAME}"'"
              }
            }'
            